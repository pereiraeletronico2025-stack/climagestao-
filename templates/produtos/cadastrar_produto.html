<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <title>Novo Produto</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='/static/style.css'>
</head>
<body>
    <div class='header'>
        <h1>Novo Produto</h1>
        <a href='/produtos' class='btn-voltar'>⬅ Voltar</a>
    </div>
    <div class='container'>
        <form method='post' class='form-painel'>
            <h3>Dados do Produto / Estoque</h3>
            <label>Codigo de Barras:</label>
            <input type='text' name='codigo_barras' placeholder='Passe o leitor ou digite' autofocus>

            <label>Nome do Produto / Peca:</label>
            <input type='text' name='nome' placeholder='Ex: Gas R410A / Tubo Cobre 1/4' required>

            <label>Descricao:</label>
            <input type='text' name='descricao'>

            <label>Unidade de Medida:</label>
            <select name='unidade'>
                <option value='UN'>Unidade (UN)</option>
                <option value='MT'>Metro (MT)</option>
                <option value='KG'>Quilo (KG)</option>
                <option value='LT'>Litro (LT)</option>
                <option value='CX'>Caixa (CX)</option>
            </select>

            <label>Preco de Custo (R$):</label>
            <input type='number' step='0.01' name='preco_custo' placeholder='0.00'>

            <label>Preco de Venda (R$):</label>
            <input type='number' step='0.01' name='preco_venda' placeholder='0.00' required>

            <label>Quantidade em Estoque:</label>
            <input type='number' step='1' name='quantidade_estoque' value='0' required>

            <button class='btn-salvar' type='submit'>Salvar Produto</button>
        </form>
    </div>
</body>
</html>
