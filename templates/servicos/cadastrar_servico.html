<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova OS</title><link rel="stylesheet" href="/static/style.css">
<style>
body{margin:0;padding:20px;background:#f4f6f9;font-family:Segoe UI,sans-serif}
.box{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e0;border-radius:8px;box-sizing:border-box}
a.btn,button{display:inline-block;padding:12px 18px;border-radius:8px;border:0;color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
.g{background:#6c757d}.v{background:#28a745;width:100%;margin-top:16px}
</style></head><body><div class="box">
<a class="btn g" href="/servicos">Voltar</a>
<h2>Nova Ordem de Servico</h2>
<form method="POST" action="/servico/novo">
<label>Cliente *</label>
<select name="cliente_id" required>
<option value="">Selecione...</option>
{% for c in clientes %}<option value="{{ c.id }}">{{ c.nome }}</option>{% endfor %}
</select>
<label>Tipo de Servico *</label>
<select name="tipo_servico" id="sel" onchange="var o=this.options[this.selectedIndex];if(o.dataset.p)document.getElementById('preco').value=o.dataset.p">
<option value="">Catalogo...</option>
{% for s in cat_servicos %}<option value="{{ s.nome }}" data-p="{{ s.valor_padrao or 0 }}">{{ s.nome }} - R$ {{ '%.2f'|format(s.valor_padrao or 0) }}</option>{% endfor %}
</select>
<input name="tipo_servico_livre" placeholder="Ou digite manualmente" style="margin-top:8px">
<label>Equipamento</label>
<select name="equipamento"><option value="">Opcional</option>
{% for a in aparelhos %}<option value="{{ a.nome }}">{{ a.nome }}</option>{% endfor %}
</select>
<label>Valor (R$)</label>
<input type="number" step="0.01" name="preco" id="preco" value="0" required>
<label>Data</label>
<input type="date" name="data_servico" id="dt">
<label>Observacoes</label>
<textarea name="descricao" rows="3"></textarea>
<button class="v" type="submit">Salvar OS</button>
</form></div>
<script>document.getElementById('dt').value=new Date().toISOString().slice(0,10)</script>
</body></html>
