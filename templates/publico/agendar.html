<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <title>Agendar Visita Técnica - {{ config.nome_empresa or 'ClimaGestão' }}</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='/static/style.css'>
    <style>
        body { background-color: #0b1329; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .booking-card { max-width: 550px; margin: 20px auto; background: #152243; border-radius: 12px; padding: 25px; border: 1px solid #223767; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .booking-header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #223767; padding-bottom: 15px; }
        .booking-header h2 { color: #00A6FF; margin: 8px 0 4px 0; font-size: 1.4rem; }
        .input-b { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #223767; background: #0b1329; color: #fff; box-sizing: border-box; font-size: 0.95rem; margin-top: 5px; }
        .input-b:focus { border-color: #00A6FF; outline: none; }
        .btn-confirm { background: #00A6FF; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; width: 100%; cursor: pointer; margin-top: 20px; }
        .form-row { margin-bottom: 15px; }
        .form-row label { font-size: 0.88rem; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>
    <div class='booking-card'>
        <div class='booking-header'>
            {% if config.logo %}
                <img src='{{ config.logo }}' style='width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: white; padding: 4px;'>
            {% endif %}
            <h2>{{ config.nome_empresa or 'ClimaGestão' }}</h2>
            <p style='color: #94a3b8; font-size: 0.85rem; margin: 0;'>Agendamento de Serviços de Climatização & Refrigeração</p>
        </div>

        <form method='POST'>
            <div class='form-row'>
                <label>Qual serviço você precisa?</label>
                <select name='tipo_servico' class='input-b' required>
                    <option value='Higienização Completa'> Higienização / Limpeza Preventiva</option>
                    <option value='Instalação de Ar-Condicionado'> Instalação de Ar-Condicionado Split</option>
                    <option value='Manutenção / Não Gela'> Manutenção / Aparelho Não Gela</option>
                    <option value='Carga de Gás Refrigerante'> Carga de Gás / Eliminação de Vazamento</option>
                    <option value='Visita Técnica para Orçamento'> Visita Técnica / Avaliação no Local</option>
                </select>
            </div>

            <div class='form-row'>
                <label>Tipo / Marca do Equipamento (Opcional):</label>
                <input type='text' name='tipo_aparelho' class='input-b' placeholder='Ex: Split LG Inverter 12.000 BTU ou Geladeira'>
            </div>

            <div class='form-row'>
                <label>Escolha um Dia e Turno Disponível:</label>
                <select name='disponibilidade_id' class='input-b' required>
                    <option value=''>-- Selecione um dia e horário livre --</option>
                    {% for slot in slots_disponiveis %}
                        <option value='{{ slot[0] }}'> {{ slot[1] }} - {{ slot[2] }} ({{ slot[3] - slot[4] }} vaga(s) restante(s))</option>
                    {% else %}
                        <option value=''>Nenhum horário livre no momento. Entre em contato pelo WhatsApp!</option>
                    {% endfor %}
                </select>
            </div>

            <div class='form-row'>
                <label>Seu Nome Completo:</label>
                <input type='text' name='nome_cliente' class='input-b' placeholder='Ex: Mariana Santos' required>
            </div>

            <div class='form-row'>
                <label>Seu WhatsApp (com DDD):</label>
                <input type='tel' name='telefone' class='input-b' placeholder='Ex: 11999998888' required>
            </div>

            <div class='form-row'>
                <label>Endereço Completo com Número:</label>
                <input type='text' name='endereco' class='input-b' placeholder='Rua, Número, Apto/Bloco' required>
            </div>

            <div class='form-row'>
                <label>Bairro / Cidade:</label>
                <input type='text' name='bairro' class='input-b' placeholder='Ex: Centro - São Paulo' required>
            </div>

            <div class='form-row'>
                <label>Observações adicionais (Opcional):</label>
                <textarea name='observacao' class='input-b' rows='2' placeholder='Ex: Aparelho fica no 3º andar...'></textarea>
            </div>

            <button type='submit' class='btn-confirm'> Confirmar Solicitação</button>
        </form>
    </div>
</body>
</html>
