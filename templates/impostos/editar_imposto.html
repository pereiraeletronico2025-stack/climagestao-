<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Imposto - {{ config.nome_empresa or 'ClimaGestão' }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="hvac-container" style="max-width:800px;">
  <header class="hvac-header">
    <a href="/impostos?mes={{ imp.mes_referencia }}" class="btn-back"> Voltar</a>
    <h2> Editar Lançamento de Imposto</h2>
  </header>

  <div class="card-tech">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2;">
          <label>Descrição da Guia:</label>
          <input class="input-hvac" name="descricao" value="{{ imp.descricao }}" required>
        </div>
        <div class="form-group">
          <label>Valor (R$):</label>
          <input class="input-hvac" type="number" step="0.01" name="valor" value="{{ imp.valor }}" required>
        </div>
        <div class="form-group">
          <label>Data Vencimento:</label>
          <input class="input-hvac" type="date" name="data_vencimento" value="{{ imp.data_vencimento or '' }}">
        </div>
        <div class="form-group">
          <label>Regime / Tipo:</label>
          <select class="input-hvac" name="tipo">
            {% for t in ['Simples', 'MEI', 'ISS', 'PIS/COFINS', 'IRPJ/CSLL', 'Outro'] %}
            <option value="{{ t }}" {% if imp.tipo == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Status:</label>
          <select class="input-hvac" name="status">
            <option value="Pendente" {% if imp.status == 'Pendente' %}selected{% endif %}>Pendente</option>
            <option value="Pago" {% if imp.status == 'Pago' %}selected{% endif %}>Pago</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary-hvac" style="margin-top:15px; width:100%;"> Salvar Alterações</button>
    </form>
  </div>
</div>
</body>
</html>
