<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Funcionario - ClimaGestao</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{margin:0;padding:20px;background:#f4f6f9;font-family:Segoe UI,sans-serif}
.box{max-width:720px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
label{display:block;margin:12px 0 6px;font-weight:600;color:#333}
input{width:100%;padding:11px;border:1px solid #cbd5e0;border-radius:8px;box-sizing:border-box}
a.btn,button.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:0;color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
.g{background:#6c757d}.v{background:#28a745}.b{background:#0d6efd}.r{background:#dc3545}
.cam-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
@media(max-width:700px){.cam-box{grid-template-columns:1fr}}
video,canvas,img.preview{width:100%;max-height:240px;background:#111;border-radius:10px;object-fit:cover}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{font-size:.85em;color:#666;margin-top:6px}
.alert{padding:12px;border-radius:8px;background:#d1e7dd;margin-bottom:12px}
</style>
</head>
<body>
<div class="box">
  <a class="btn g" href="/funcionarios">Voltar</a>
  <h2>Novo Funcionario</h2>
  <p class="hint">Preencha os dados e tire a foto facial para o ponto automatico.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}{% for c,m in messages %}<div class="alert">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST" action="/funcionario/novo" id="formFunc">
    <label>Nome *</label>
    <input name="nome" required placeholder="Nome completo">
    <label>Email</label>
    <input name="email" type="email">
    <label>Telefone</label>
    <input name="telefone">
    <label>Cargo</label>
    <input name="cargo" placeholder="Tecnico / Auxiliar">
    <label>Salario Base (R$)</label>
    <input name="salario_base" type="number" step="0.01" value="0">
    <label>Comissao (%)</label>
    <input name="comissao_percentual" type="number" step="0.01" value="0">

    <label>Foto Facial (obrigatoria para ponto facial)</label>
    <input type="hidden" name="foto_base64" id="foto_base64">
    <div class="cam-box">
      <div>
        <video id="video" autoplay playsinline></video>
        <div class="actions">
          <button type="button" class="btn b" id="btnStart">Abrir Camera</button>
          <button type="button" class="btn v" id="btnSnap">Tirar Foto</button>
          <button type="button" class="btn r" id="btnStop">Fechar Camera</button>
        </div>
      </div>
      <div>
        <img id="preview" class="preview" alt="Preview da foto" style="display:none">
        <canvas id="canvas" style="display:none"></canvas>
        <p class="hint" id="fotoStatus">Nenhuma foto capturada ainda.</p>
      </div>
    </div>

    <button class="btn v" style="width:100%;margin-top:18px;padding:14px" type="submit">Salvar Funcionario</button>
  </form>
</div>
<script>
let stream=null;
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const preview=document.getElementById('preview');
const fotoInput=document.getElementById('foto_base64');
const statusEl=document.getElementById('fotoStatus');

document.getElementById('btnStart').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    video.srcObject=stream;
    statusEl.textContent='Camera ativa. Posicione o rosto e clique em Tirar Foto.';
  }catch(e){
    alert('Nao foi possivel abrir a camera: '+e.message);
  }
};
document.getElementById('btnStop').onclick=()=>{
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
};
document.getElementById('btnSnap').onclick=()=>{
  if(!video.srcObject){alert('Abra a camera primeiro.');return;}
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  const data=canvas.toDataURL('image/jpeg',0.85);
  fotoInput.value=data;
  preview.src=data;
  preview.style.display='block';
  statusEl.textContent='Foto capturada com sucesso!';
};
document.getElementById('formFunc').onsubmit=()=>{
  // foto opcional, mas recomendada
  return true;
};
</script>
</body></html>
