<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Funcionario</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{margin:0;padding:20px;background:#f4f6f9;font-family:Segoe UI,sans-serif}
.box{max-width:720px;margin:0 auto;background:#fff;border-radius:12px;padding:28px}
label{display:block;margin:12px 0 6px;font-weight:600}
input{width:100%;padding:11px;border:1px solid #cbd5e0;border-radius:8px;box-sizing:border-box}
a.btn,button.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:0;color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
.g{background:#6c757d}.v{background:#28a745}.b{background:#0d6efd}.r{background:#dc3545}
.cam-box{display:grid;grid-template-columns:1fr 1fr;gap:16px}
video,img.preview{width:100%;max-height:220px;background:#111;border-radius:10px;object-fit:cover}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <a class="btn g" href="/funcionarios">Voltar</a>
  <h2>Editar Funcionario</h2>
  <form method="POST">
    <label>Nome *</label><input name="nome" value="{{ f.nome }}" required>
    <label>Email</label><input name="email" value="{{ f.email or '' }}">
    <label>Telefone</label><input name="telefone" value="{{ f.telefone or '' }}">
    <label>Cargo</label><input name="cargo" value="{{ f.cargo or '' }}">
    <label>Salario</label><input name="salario_base" type="number" step="0.01" value="{{ f.salario_base or 0 }}">
    <label>Comissao %</label><input name="comissao_percentual" type="number" step="0.01" value="{{ f.comissao_percentual or 0 }}">
    <label>Foto Facial</label>
    <input type="hidden" name="foto_base64" id="foto_base64" value="">
    <div class="cam-box">
      <div>
        <video id="video" autoplay playsinline></video>
        <div class="actions">
          <button type="button" class="btn b" id="btnStart">Camera</button>
          <button type="button" class="btn v" id="btnSnap">Tirar Foto</button>
        </div>
      </div>
      <div>
        <img id="preview" class="preview" src="{{ f.foto_base64 or '' }}" style="{{ 'display:block' if f.foto_base64 else 'display:none' }}">
        <canvas id="canvas" style="display:none"></canvas>
      </div>
    </div>
    <button class="btn v" style="width:100%;margin-top:16px" type="submit">Salvar</button>
  </form>
</div>
<script>
let stream=null;
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const preview=document.getElementById('preview');
const fotoInput=document.getElementById('foto_base64');
document.getElementById('btnStart').onclick=async()=>{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  video.srcObject=stream;
};
document.getElementById('btnSnap').onclick=()=>{
  canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  const d=canvas.toDataURL('image/jpeg',0.85);
  fotoInput.value=d; preview.src=d; preview.style.display='block';
};
</script>
</body></html>
